<div class="favorites-container">
  <app-sidebar [(isOpen)]="sidebarOpen"></app-sidebar>

  <div class="main-content" [class.sidebar-closed]="!sidebarOpen">
    <app-header class="fixed-header" (toggleSidebar)="toggleSidebar()"></app-header>

    <main class="content">
      <section class="hero-section">
        <h1 class="hero-title">Mes Favoris</h1>
        <p class="hero-subtitle">Vos livres préférés en un coup d'œil</p>
      </section>

      <section class="content-in" *ngIf="isLoading">
        <div class="loading-section">
          <div class="loading-spinner"></div>
          <p>Chargement...</p>
        </div>
      </section>

      <section class="content-in" *ngIf="error && !isLoading">
        <div class="error-section">
          <p>{{ error }}</p>
          <button class="retry-button" (click)="loadFavorites()">Réessayer</button>
        </div>
      </section>

      <section class="content-in" *ngIf="!isLoading && !error && books.length === 0">
        <div class="empty-section">
          <i class="fas fa-book"></i>
          <h2>Aucun favori</h2>
          <p>Ajoutez vos livres préférés à votre liste de favoris</p>
          <button class="primary-button" (click)="router.navigate(['/home'])">Découvrir des livres</button>
        </div>
      </section>

      <section class="section" *ngIf="!isLoading && !error && books.length > 0">
        <div class="books-grid">
          <div class="book-card-container" *ngFor="let book of books">
            <div class="book-card" (click)="onBookClick(book)">
              <div class="book-cover-wrapper">
                <img [src]="book.cover" [alt]="book.title" class="book-cover"/>
                <span class="favorite-badge"><i class="fas fa-star"></i></span>
              </div>
              <div class="book-info">
                <h3 class="book-title">{{ book.title }}</h3>
                <p class="book-author">{{ book.author }}</p>
                <div class="book-meta">
                  <span class="book-rating"><i class="fas fa-star"></i> {{ formatRating(book.rating) }}</span>
                  <span class="book-genre">{{ book.genre }}</span>
                </div>
              </div>
              <div class="book-overlay">
                <button class="overlay-button">Continuer la lecture</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>
