<div class="finished-container">
  <app-sidebar [(isOpen)]="sidebarOpen"></app-sidebar>

  <div class="main-content" [class.sidebar-closed]="!sidebarOpen">
    <app-header class="fixed-header" (toggleSidebar)="toggleSidebar()"></app-header>
    
    <main class="content">
      <section class="hero-section">
        <h1 class="hero-title">Livres terminés</h1>
        <p class="hero-subtitle">Vos lectures accomplies</p>
      </section>

      <section class="content-in">
        <div *ngIf="isLoading" class="loading-section">
          <div class="loading-spinner"></div>
          <p>Chargement...</p>
        </div>

        <div *ngIf="error && !isLoading" class="error-section">
          <p>{{ error }}</p>
          <button class="retry-button" (click)="loadFinishedBooks()">Réessayer</button>
        </div>

        <div *ngIf="!isLoading && !error && books.length === 0" class="empty-section">
          <div class="empty-icon">📚</div>
          <h2>Aucun livre terminé</h2>
          <p>Terminez vos premières lectures pour les voir apparaître ici</p>
          <button class="primary-button" (click)="router.navigate(['/reading'])">Voir mes lectures</button>
        </div>

        <section class="section" *ngIf="!isLoading && !error && books.length > 0">
          <div class="books-grid">
            <div class="book-card-container" *ngFor="let book of books">
              <div class="book-card" (click)="onBookClick(book)">
                <div class="book-cover-wrapper">
                  <img [src]="book.cover" [alt]="book.title" class="book-cover"/>
                  <div class="completed-badge">✓</div>
                </div>
                <div class="book-info">
                  <div class="title-row">
                    <h3 class="book-title">{{ book.title }}</h3>
                    <button 
                      class="delete-btn"
                      (click)="removeFromFinished($event, book)"
                      title="Retirer des terminés"
                      aria-label="Retirer des terminés">
                      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                      </svg>
                    </button>
                  </div>
                  <p class="book-author">{{ book.author }}</p>
                  <div class="book-meta">
                    <span class="book-rating">⭐ {{ formatRating(book.rating) }}</span>
                    <span class="book-genre">{{ book.genre }}</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </section>
    </main>
  </div>
</div>
