<div class="home-container">
  <app-sidebar [(isOpen)]="sidebarOpen"></app-sidebar>

  <div class="main-content" [class.sidebar-closed]="!sidebarOpen">
    <app-header 
      class="fixed-header"
      (toggleSidebar)="toggleSidebar()"
    ></app-header>
    
    <main class="content">
      <!-- Section Hero -->
      <section class="hero-section">
        <h1 class="hero-title">Content de te revoir, lecteur !</h1>
        <p class="hero-subtitle">Découvre notre sélection de livres</p>
      </section>

      <section class="content-in">
        <!-- Indicateur de chargement -->
        <div *ngIf="isLoading" class="loading-section">
          <div class="loading-spinner"></div>
          <p>Chargement des livres...</p>
        </div>

        <!-- Message d'erreur -->
        <div *ngIf="error && !isLoading" class="error-section">
          <p>{{ error }}</p>
          <button class="retry-button" (click)="loadMixedBooks()">Réessayer</button>
        </div>

        <!-- SECTION UNIQUE : Tous les livres -->
        <section class="section" *ngIf="!isLoading && !error && allBooks.length > 0">
          <div class="section-header">
            <h2 class="section-title">
              <span class="section-icon">📚</span>
              Tous les livres
            </h2>
          </div>
          
          <div class="books-grid" style="grid-template-columns: repeat(5, 1fr);">
            <div 
              class="book-card" 
              *ngFor="let book of allBooks" 
              (click)="onBookClick(book)"
            >
              <div class="book-cover-wrapper">
                <img 
                  [src]="book.cover" 
                  [alt]="book.title" 
                  class="book-cover"
                  loading="lazy"
                  (error)="onImageError($event)"
                />
                <div class="book-overlay">
                  <button class="overlay-button">Voir les détails</button>
                </div>
              </div>
              <div class="book-info">
                <h3 class="book-title">{{ book.title }}</h3>
                <p class="book-author">{{ book.author }}</p>
                <div class="book-meta">
                  <span class="book-rating">⭐ {{ formatRating(book.rating) }}</span>
                  <span class="book-genre">{{ book.genre }}</span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- Aucun livre trouvé -->
        <div *ngIf="!isLoading && !error && allBooks.length === 0" class="empty-state">
          <p>Aucun livre disponible pour le moment.</p>
        </div>
      </section>
    </main>
  </div>
</div>
