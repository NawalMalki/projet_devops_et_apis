<div class="reading-container">
  <app-sidebar [(isOpen)]="sidebarOpen"></app-sidebar>

  <div class="main-content" [class.sidebar-closed]="!sidebarOpen">
    <app-header 
      class="fixed-header"
      (toggleSidebar)="toggleSidebar()"
    ></app-header>
    
    <main class="content">
      <section class="hero-section">
        <h1 class="hero-title">En cours de lecture</h1>
        <p class="hero-subtitle">Continuez vos lectures en cours</p>
      </section>

      <section class="content-in">
        <div *ngIf="isLoading" class="loading-section">
          <div class="loading-spinner"></div>
          <p>Chargement...</p>
        </div>

        <div *ngIf="error && !isLoading" class="error-section">
          <p>{{ error }}</p>
          <button class="retry-button" (click)="loadReadingBooks()">Réessayer</button>
        </div>

        <div *ngIf="!isLoading && !error && books.length === 0" class="empty-section">
          <div class="empty-icon">📚</div>
          <h2>Aucune lecture en cours</h2>
          <p>Commencez à lire un livre pour le retrouver ici</p>
          <button class="primary-button" (click)="router.navigate(['/home'])">Découvrir des livres</button>
        </div>

        <section class="section" *ngIf="!isLoading && !error && books.length > 0">
          <div class="books-grid">
            <div 
              class="book-card" 
              *ngFor="let book of books" 
              (click)="onBookClick(book)"
            >
              <div class="book-cover-wrapper">
                <img 
                  [src]="book.cover" 
                  [alt]="book.title" 
                  class="book-cover"
                />
                <div class="book-overlay">
                  <button class="overlay-button">Continuer la lecture</button>
                </div>
              </div>
              <div class="book-info">
                <h3 class="book-title">{{ book.title }}</h3>
                <p class="book-author">{{ book.author }}</p>
                <div class="book-meta">
                  <span class="book-rating">⭐ {{ formatRating(book.rating) }}</span>
                  <span class="book-genre">{{ book.genre }}</span>
                </div>
              </div>
            </div>
          </div>
        </section>
      </section>
    </main>
  </div>
</div>
