<aside class="sidebar playfair-display-font" [class.sidebar-closed]="!isOpen">
 <button (click)="closeSidebar()" class="close-btn">×</button>
  <nav class="sidebar-nav">
    <div class="nav-section">
      <h3 class="nav-section-title">Menu</h3>
      <ul class="nav-list">
        <li *ngFor="let item of menuItems">
          <a 
            [routerLink]="item.route" 
            class="nav-item"
            [class.nav-item-active]="item.active"
            (click)="onMenuItemClick(item)"
          >
            
            <span class="nav-label">{{ item.label }}</span>
          </a>
        </li>
      </ul>
    </div>

    <!-- Dynamic categories from Google Books API -->
    <div class="nav-section">
      <h3 class="nav-section-title">Catégories</h3>
      
      <div *ngIf="isLoadingGenres" class="loading-genres">
        <p>Chargement...</p>
      </div>

      <ul class="nav-list" *ngIf="!isLoadingGenres">
        <li *ngFor="let category of categories">
          <a 
            href="#" 
            class="nav-item"
            (click)="onGenreClick(category, $event)"
          >
            <span class="nav-label">{{ category.name }}</span>
            <span class="nav-count">{{ category.count }}</span>
          </a>
        </li>
      </ul>
    </div>
  </nav>
</aside>
